# 112: sudo cp ... /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d hrms-api.syaco.co.th
server {
    listen 80;
    server_name hrms-api.syaco.co.th;
    client_max_body_size 50M;   # นำเข้า Excel / อัปโหลดเอกสาร
    location / {
        proxy_pass http://127.0.0.1:5229;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
